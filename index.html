<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MahaMate</title>
    <meta http-equiv="refresh" content="0; url=dashboard/dashboard.html">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #151A2D;
            color: #fff;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #00C2FF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #00C2FF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-family: 'Fredoka', sans-serif;">
            <span style="color: #00C2FF;">Maha</span><span style="color: #FFE600;">Mate</span>
        </h1>
        <p>Mengalihkan ke <a href="dashboard/dashboard.html">Dashboard</a>...</p>
        <div class="loader"></div>
    </div>
</body>
</html>
